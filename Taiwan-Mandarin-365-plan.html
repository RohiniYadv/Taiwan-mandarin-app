.station.done .dotc { background: var(--line); color: var(--on-line); } .station.part .dotc { background: color-mix(in srgb, var(--line) 35%, var(--panel)); }
.station.cp .dotc { border-radius: 8px; border-color: var(--ink); } .station.now .dotc { animation: pulse 1.8s ease-out infinite; }

.cando { margin: 0; padding-left: 20px; } .cando li { margin: 3px 0; } .apps { display: flex; gap: 8px; flex-wrap: wrap; margin: 0; } .chap { background: var(--panel); border: 2px solid var(--rule); border-radius: 4px; padding: 4px 10px; font-size: .92rem; } .chap b { font-family: var(--code); font-size: 1.05rem; }

.stations { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.station:nth-child(7n+1)::before { display: none; }

@media (max-width: 600px) { .brand > div { display: none; } #dayc { font-size: 1.05rem; margin-left: auto; } #nav { padding: 6px 4px 0; } }

  function viewPlaybook() {
    var items = [
      ["How a day works", "<p>Most weekdays have three parts of about 50 minutes: 20 minutes in the course app, 15 minutes on the week’s phrases or pattern, and 15 minutes of listening, reading or office practice. Saturday is a 90-minute mission in the real world, and Sunday is a 40-minute review and plan.</p><p>On a bad day, tick the <b>Light day</b> box. Ten minutes in the app and five minutes on the phrases keeps the streak and the habit. A short day is always better than a skipped day.</p>"],
      ["Tones and pronunciation", "<p>Tones carry meaning, so train them first and keep training them. Say every new word slowly with exaggerated tones, then at normal speed. Record yourself and compare with the app’s audio. Pay attention to the third tone: two in a row become 2 + 3, and 不 and 一 change before a fourth tone.</p><p>Learn Zhuyin in week 1. Taiwan uses it in schools, on signs for children, and on phone keyboards, and it makes the sounds easier to see than pinyin.</p>"],
      ["Shadowing", "<p>Play a sentence, listen once, then repeat it in the gap. Next, speak at the same time as the audio. Aim to copy the rhythm and tones, not only the words. Five rounds of three sentences is enough. Use slow audio first, then normal speed.</p>"],
      ["Flashcards that work", "<p>Add only what you met in the app or at work, never long random lists. Each card: Chinese on the front, English and a recorded sound on the back. Add about six new cards on weekdays and clear every due card each day. Skipping reviews is what breaks flashcards, so keep new cards low rather than let reviews pile up.</p><p>Make cards from sentences as well as words: a sentence shows how a word is used.</p>"],
      ["Typing in Chinese", "<p>Install a Zhuyin keyboard on your phone and computer, even if you also use pinyin. Typing forces you to recall the sound and to recognise the right character from a list, which builds reading faster than copying by hand. Hand-write only your own name and the characters you see most often.</p>"],
      ["The one-sentence rule at work", "<p>Every workday, say or write one new sentence in Chinese to a colleague, in a chat or in a meeting. It can be as small as 麻煩你了 or 我先處理. Taiwanese colleagues are usually warm toward attempts, and real replies teach you far more than practice alone. Note what they say back.</p>"],
      ["Tutor or language partner", "<p>One 45-minute session a week is the biggest accelerator you can add. Ask for corrections, not only conversation. Agenda by phase: Quarter 1, pronunciation and short dialogues. Quarter 2, role-play meetings and correct your emails. Quarter 3, customer calls, presentations and negotiation. Quarter 4, free conversation, interviews and storytelling. Send the tutor your Friday work task beforehand.</p>"],
      ["The recordings that prove your progress", "<p>At the baseline and each checkpoint, read the same standard script aloud and save the recording with the checkpoint name. Also keep one piece of writing from each checkpoint. At the end, play the first and last recordings back to back.</p>"],
      ["Error notebook", "<p>Keep one page with your mistakes: wrong tone, wrong word, wrong order. Write the correct version beside each. Review it every Sunday and test yourself on the five most frequent. In week 51 you will repair the top patterns.</p>"],
      ["When you miss days", "<p>Missing one day: do the light version next day and carry on. Missing a week: skip the new material, do two review sessions, then continue from the next Monday. Never try to catch up by doubling days. If you fall more than two weeks behind, change the start date in Progress to resume from the week you reached.</p>"],
      ["What to expect, honestly", "<p>About 330 hours in a year is a strong start but not fluency. US Foreign Service estimates put Mandarin at roughly 2,200 class hours to professional proficiency for English speakers. Expect to function well in the situations you rehearse here: office basics, meetings, email, customer calls and daily life in Taiwan, with simple but real conversations.</p><p>For reference, TOCFL Level 2 is about 1,000 words and Level 3 about 2,500. Check the current word lists on the TOCFL site. This plan aims at Level 2 overall with your office topics stronger, and a start on Level 3. Your result depends on consistency far more than on any single week.</p>"],
      ["Resources", "<ul><li><b>Course app:</b> the Taiwan Mandarin course page you already have, with lessons, quizzes and speaking tests.</li><li><b>Dictionary:</b> Pleco on your phone, and the Ministry of Education Revised Mandarin Dictionary (dict.revised.moe.edu.tw) for Taiwan readings.</li><li><b>Flashcards:</b> Anki.</li><li><b>Tests and word lists:</b> the TOCFL site (tocfl.edu.tw) has level descriptions and sample items.</li><li><b>Listening:</b> PTS news (公視新聞), Taiwanese dramas with Traditional Chinese subtitles, and learner podcasts made in Taiwan.</li><li><b>People:</b> a tutor on a platform such as italki, a university language centre in Taiwan, a language-exchange app, and your own colleagues.</li><li><b>Your own work:</b> emails, announcements and meeting recordings (with permission) are the best practice material.</li></ul><p class=\"hint\">Availability of services changes, so check each one before relying on it.</p>"]
    ];
    return "<section class=\"intro\"><h1>Playbook: how to study</h1><p>The methods behind the plan. Skim once, then return when a week feels hard.</p></section>" + items.map(function (i, k) { return "<details class=\"pb\"" + (k === 0 ? " open" : "") + "><summary>" + esc(i[0]) + "</summary><div>" + i[1] + "</div></details>"; }).join("");
  }

    $("#dayc").textContent = "Day " + currentDay() + " / 365";
  }
  function go(v, week) { VIEW = v; if (week) { WEEK = week; } render(false); }

  document.addEventListener("click", function (e) {
    var t = e.target, b;
    if ((b = t.closest("[data-say]"))) { say(b.getAttribute("data-say")); return; }
    if ((b = t.closest("#nav button"))) { go(b.getAttribute("data-view")); return; }
    if ((b = t.closest("[data-week]")) && b.tagName === "BUTTON") { WEEK = +b.getAttribute("data-week"); VIEW = "weeks"; render(false); return; }
    if ((b = t.closest("[data-day]")) && b.tagName === "BUTTON") { var n = +b.getAttribute("data-day"); S.sel = n === 0 ? null : n; save(); VIEW = "today"; render(false); return; }
    if (t.id === "resetb") { if (confirm("Delete all progress and ratings on this device?")) { S.done = {}; S.light = {}; S.rate = {}; S.rec = {}; save(); render(true); } }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.task) { if (t.checked) { S.done[t.dataset.task] = true; } else { delete S.done[t.dataset.task]; } save(); render(true); return; }
    if (t.id === "lightbox") { S.light[activeDay()] = t.checked ? true : undefined; if (!t.checked) { delete S.light[activeDay()]; } save(); render(true); return; }
    if (t.id === "wksel") { WEEK = +t.value; render(false); return; }
    if (t.id === "startd") { if (t.value) { S.start = t.value; S.sel = null; save(); render(true); } return; }
    if (t.id === "aidsel") { S.aid = t.value; save(); render(true); return; }
    if (t.dataset && t.dataset.rec !== undefined) { S.rec[t.dataset.rec] = t.checked; save(); return; }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.rate) { var p = t.dataset.rate.split("|"), n = +p[0]; S.rate[n] = S.rate[n] || {}; S.rate[n][p[1]] = +t.value; save(); t.nextElementSibling.textContent = t.value; var svg = $(".chart"); if (svg) { var holder = svg.parentNode; var tmp = document.createElement("div"); tmp.innerHTML = chart(); var nsvg = tmp.querySelector("svg"); svg.replaceWith(nsvg); var lg = tmp.querySelector(".legend2"); var oldlg = $(".legend2"); if (lg && oldlg) { oldlg.replaceWith(lg); } } }
  });
  $("#aidsel").value = S.aid;
  render(false);
  window.__p = { S: function () { return S; }, go: go, render: render, totals: totals };
})();

</script>
