<style>
:root {
  --paper: #ECEFEA; --tile: rgba(22, 34, 45, .05); --panel: #FFFFFF; --ink: #16222D; --muted: #566370; --rule: #CCD4CE;
  --sign: #1D252C; --sign-ink: #F3F6F2; --sign-muted: #AAB6BD; --amber: #FFC24A;
  --red: #D61F32; --blue: #0A66B3; --green: #0B8A5A; --orange: #F4A21E;
  --ok: #14794A; --ok-bg: #DDF3E6; --bad: #BE2633; --bad-bg: #FBE0E2; --tint: rgba(22, 34, 45, .06);
  --zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --code: "Barlow Condensed", "Arial Narrow", var(--zh);
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #10161B; --tile: rgba(255, 255, 255, .035); --panel: #19222A; --ink: #EBF1F4; --muted: #9DAAB3; --rule: #2C3944; --sign: #0A0E12; --ok: #4BC98C; --ok-bg: #12301F; --bad: #FF7480; --bad-bg: #351519; --tint: rgba(255, 255, 255, .07); --red: #F0485A; --blue: #4C9DE0; --green: #2FBE86; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #10161B; --tile: rgba(255, 255, 255, .035); --panel: #19222A; --ink: #EBF1F4; --muted: #9DAAB3; --rule: #2C3944; --sign: #0A0E12; --ok: #4BC98C; --ok-bg: #12301F; --bad: #FF7480; --bad-bg: #351519; --tint: rgba(255, 255, 255, .07); --red: #F0485A; --blue: #4C9DE0; --green: #2FBE86; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); -webkit-text-size-adjust: 100%; }
html.in-session { overflow: hidden; }
body { margin: 0; font-family: var(--zh); font-size: 16px; line-height: 1.55; color: var(--ink); background-color: var(--paper); background-image: linear-gradient(var(--tile) 1px, transparent 1px), linear-gradient(90deg, var(--tile) 1px, transparent 1px); background-size: 56px 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--sign); z-index: 40; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.c-red { --line: var(--red); --on-line: #fff; } .c-blue { --line: var(--blue); --on-line: #fff; } .c-green { --line: var(--green); --on-line: #fff; } .c-orange { --line: var(--orange); --on-line: #16222D; }
.ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 41; background: var(--sign); color: var(--sign-ink); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.roundel { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--line, var(--red)); color: var(--on-line, #fff); font-family: var(--code); font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; flex: none; }
.brand .roundel { background: #fff; color: var(--sign); border: 4px solid var(--red); font-family: var(--zh); font-weight: 900; font-size: 1rem; }
.brand b { display: block; font-weight: 900; font-size: 1.1rem; line-height: 1.1; }
.brand small { color: var(--sign-muted); font-family: var(--code); font-size: .95rem; letter-spacing: .03em; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #3A4650; border-radius: 4px; font-family: var(--code); font-size: 1.1rem; font-weight: 600; background: transparent; color: var(--sign-ink); }
#stat-streak .ic { color: #FF8A3D; } #stat-xp .ic { color: var(--amber); }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; background: transparent; border: 1px solid #3A4650; border-radius: 4px; color: var(--sign-ink); }
.top :focus-visible { outline-color: var(--amber); }
#voicenote { background: #4A3A12; color: #FFEBC2; font-size: .9rem; }
#voicenote > div { max-width: 760px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
#voicenote button { background: transparent; border: 1px solid #A38A45; color: inherit; border-radius: 4px; padding: 3px 10px; }
#voicenote[hidden] { display: none; }

.app { max-width: 760px; margin: 0 auto; padding: 18px 16px 72px; }

/* departure board */
.board { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; background: var(--sign); color: var(--sign-ink); border-radius: 6px; padding: 20px 22px 24px; border-bottom: 8px solid var(--line, var(--red)); }
.board-k { font-family: var(--code); font-size: 1.15rem; color: var(--amber); font-weight: 600; letter-spacing: .03em; }
.board-k small { color: var(--sign-muted); font-size: .95rem; font-weight: 500; margin-left: 6px; }
.board-t { margin: 2px 0 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.1; font-weight: 900; letter-spacing: .04em; }
.board-s { margin: 6px 0 0; color: var(--sign-muted); font-size: .95rem; }
.go { background: var(--amber); color: #16222D; border: 0; border-radius: 4px; padding: 14px 22px; font-weight: 900; font-size: 1.1rem; box-shadow: 0 4px 0 #B88714; }
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 #B88714; }
.board-done { font-size: 2rem; font-weight: 900; color: var(--amber); }
.board :focus-visible { outline-color: var(--amber); }

.today { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 4px 6px; }
.goal { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; }
.goal .k { font-weight: 700; font-size: .92rem; white-space: nowrap; }
.goal .v { font-family: var(--code); font-size: 1.1rem; white-space: nowrap; color: var(--muted); }
.meter { flex: 1; height: 12px; background: var(--tint); border-radius: 6px; overflow: hidden; border: 1px solid var(--rule); }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 6px; transition: width .4s; }
.kv { display: flex; align-items: baseline; gap: 6px; } .kv b { font-family: var(--code); font-size: 1.6rem; line-height: 1; } .kv span { color: var(--muted); font-size: .9rem; }
.ghost { background: var(--panel); border: 2px solid var(--rule); border-radius: 6px; padding: 8px 14px; font-weight: 700; font-size: .92rem; }
.ghost:not(:disabled):hover { border-color: var(--ink); } .ghost:disabled { opacity: .5; }
.danger { background: var(--bad-bg); color: var(--bad); border: 2px solid var(--bad); border-radius: 6px; padding: 8px 14px; font-weight: 700; }

/* lines and stations */
.line { margin-top: 34px; }
.line-h { display: flex; gap: 14px; align-items: center; padding-bottom: 10px; border-bottom: 3px solid var(--line); }
.line-h .roundel { width: 44px; height: 44px; font-size: 1.35rem; }

.line-h > div { flex: 1; min-width: 0; }
.line-p { font-family: var(--code); font-size: 1.05rem; color: var(--muted); white-space: nowrap; }
.station { margin-top: 26px; }
.sign { display: flex; align-items: stretch; background: var(--sign); color: var(--sign-ink); border-radius: 4px; overflow: hidden; }
.sign .code { display: grid; place-items: center; min-width: 74px; padding: 0 10px; background: var(--line); color: var(--on-line); font-family: var(--code); font-size: 1.7rem; font-weight: 700; letter-spacing: .02em; }
.sign .names { padding: 10px 14px; flex: 1; min-width: 0; }
.sign h3 { margin: 0; font-size: 1.35rem; line-height: 1.2; font-weight: 900; letter-spacing: .04em; }
.sign p { margin: 0; color: var(--sign-muted); font-size: .92rem; font-family: var(--code); font-size: 1.05rem; letter-spacing: .02em; }
.crown { align-self: center; margin-right: 12px; font-size: .85rem; font-weight: 700; color: var(--amber); border: 1px solid var(--amber); border-radius: 3px; padding: 2px 8px; white-space: nowrap; }
.testout { align-self: center; margin-right: 12px; background: transparent; color: var(--sign-ink); border: 1px solid #5B6A75; border-radius: 4px; padding: 5px 12px; font-weight: 700; font-size: .85rem; }
.sign :focus-visible { outline-color: var(--amber); }
.station .blurb { margin: 8px 2px 0; color: var(--muted); font-size: .92rem; }
.stops { position: relative; margin-top: 6px; }
.stops::before { content: ""; position: absolute; left: 26px; top: 28px; bottom: 28px; width: 10px; margin-left: -5px; background: var(--line); border-radius: 5px; }
.station.is-locked .stops::before { background: var(--rule); }
.stop { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 6px 8px 6px 0; background: transparent; border: 0; text-align: left; }
.dotwrap { width: 52px; display: grid; place-items: center; flex: none; }
.dot { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--panel); border: 7px solid var(--line); color: var(--ink); }
.dot .ic { width: 15px; height: 15px; } 
.stop.done .dot { background: var(--line); color: var(--on-line); border-color: var(--line); }
.stop.locked .dot { border-color: var(--rule); color: var(--muted); }
.stop.locked { opacity: .6; }
.stop.current .dot { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--line) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.stop.quiz .dot { width: 46px; height: 46px; border: 6px solid var(--ink); background: var(--panel); color: var(--line); }
.stop.quiz.done .dot { background: var(--ink); color: var(--amber); }
.stop.quiz.locked .dot { border-color: var(--rule); color: var(--muted); }
.stop.speech .dot { border-radius: 10px; background: var(--line); border-color: var(--line); color: var(--on-line); width: 40px; height: 40px; }
.stop.speech.locked .dot { background: var(--panel); border-color: var(--rule); color: var(--muted); }
.stop-t { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.stop-t b { font-size: 1.05rem; font-weight: 700; } .stop-t small { color: var(--muted); font-size: .88rem; }
.stop:not(:disabled):hover .stop-t b { text-decoration: underline; text-underline-offset: 3px; }
.stars { font-family: var(--code); font-size: 1.1rem; color: var(--muted); margin-right: 6px; white-space: nowrap; letter-spacing: .05em; }
details.tip { margin: 8px 2px 0; font-size: .9rem; color: var(--muted); } details.tip summary { cursor: pointer; font-weight: 700; color: var(--ink); } details.tip p { margin: 6px 0 0; max-width: 62ch; }

/* session */
.session { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: var(--paper); padding-top: env(safe-area-inset-top, 0px); }
.s-top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; max-width: 700px; width: 100%; margin: 0 auto; }
.s-close { background: transparent; border: 0; color: var(--muted); padding: 6px; border-radius: 4px; } .s-close .ic { width: 22px; height: 22px; }
.s-prog { flex: 1; height: 14px; background: var(--tint); border-radius: 7px; overflow: hidden; border: 1px solid var(--rule); } .s-prog i { display: block; height: 100%; width: 0; background: var(--line, var(--green)); border-radius: 7px; transition: width .35s; }
.s-hearts { display: flex; align-items: center; gap: 4px; color: var(--bad); font-family: var(--code); font-size: 1.25rem; font-weight: 700; min-width: 46px; } .s-hearts .ic { width: 24px; height: 24px; }
.s-main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.s-body { max-width: 700px; margin: 0 auto; padding: 8px 16px 24px; }
.q { font-size: 1.35rem; margin: 10px 0 18px; font-weight: 700; line-height: 1.3; }
.ex-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 20px; position: relative; }
.hz { font-family: var(--zh); font-weight: 700; font-size: 1.5rem; line-height: 1.3; letter-spacing: .02em; } .hz.big { font-size: 3.4rem; font-weight: 900; line-height: 1.15; }
.en { color: var(--muted); font-size: 1rem; display: block; } .promptEn { font-size: 1.5rem; font-weight: 700; }
.rd { display: flex; flex-direction: column; } .rd-py { font-size: 1.05rem; color: var(--muted); } .rd-zy { font-size: 1rem; color: var(--muted); letter-spacing: .06em; }
.zh.ruby { font-size: 2rem; font-weight: 700; line-height: 2.1; letter-spacing: .04em; } ruby { ruby-position: over; } rt { font-size: .38em; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.sentline { font-size: 2rem; font-weight: 700; line-height: 1.5; letter-spacing: .04em; } .gap { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--ink); margin: 0 .15em; color: transparent; }
.bubble { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); border: 2px solid var(--rule); border-radius: 6px 18px 18px 18px; }
.audio-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff; border: 0; flex: none; } .audio-btn[data-slow] { background: var(--muted); } .audio-btn .ic { width: 22px; height: 22px; }
.bigaudio { display: flex; gap: 12px; } .bigaudio .audio-btn { width: 72px; height: 72px; } .bigaudio .audio-btn .ic { width: 32px; height: 32px; }
.mini-audio { position: absolute; right: 0; top: 0; }
.opts { display: flex; flex-direction: column; gap: 10px; } .opts.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; text-align: left; padding: 12px 14px; background: var(--panel); border: 2px solid var(--rule); border-bottom-width: 4px; border-radius: 8px; font-size: 1.1rem; }
.opt kbd { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--rule); border-radius: 4px; font-family: var(--code); font-size: .95rem; color: var(--muted); flex: none; }
.optbody { display: flex; flex-direction: column; min-width: 0; }
.opt:not(:disabled):hover { border-color: var(--ink); } .opt.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--panel)); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); } .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .rd-big { font-size: 1.3rem; font-weight: 700; display: flex; flex-direction: column; } .opt .rd-big small { font-size: .95rem; font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.opts.grid .opt .hz { font-size: 1.9rem; }
.intro { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.introcard { position: relative; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; background: var(--panel); border: 2px solid var(--rule); border-radius: 8px; }
.introcard .hz { font-size: 1.9rem; } .introcard .spk { position: absolute; right: 10px; top: 10px; color: var(--blue); }
.matchgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .mcol { display: flex; flex-direction: column; gap: 10px; }
.mbtn { min-height: 60px; padding: 8px 12px; background: var(--panel); border: 2px solid var(--rule); border-bottom-width: 4px; border-radius: 8px; text-align: left; display: flex; flex-direction: column; justify-content: center; font-size: 1rem; }
.mbtn .hz { font-size: 1.5rem; } .mbtn.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--panel)); } .mbtn.done { border-color: var(--ok); background: var(--ok-bg); opacity: .75; } .mbtn.shake { border-color: var(--bad); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.answer-line { display: flex; flex-wrap: wrap; gap: 8px; min-height: 76px; padding: 10px 4px; border-top: 2px solid var(--rule); border-bottom: 2px solid var(--rule); margin-bottom: 16px; align-content: flex-start; }
.answer-line.right { border-color: var(--ok); } .answer-line.wrong { border-color: var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { font-family: var(--zh); font-weight: 700; font-size: 1.35rem; padding: 8px 14px; background: var(--panel); border: 2px solid var(--rule); border-bottom-width: 4px; border-radius: 8px; } .tile.used { opacity: .25; } .tile:not(:disabled):hover { border-color: var(--ink); }
.typebox { width: 100%; font: inherit; font-size: 1.4rem; padding: 12px 14px; border: 2px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--ink); } .typebox.right { border-color: var(--ok); background: var(--ok-bg); } .typebox.wrong { border-color: var(--bad); background: var(--bad-bg); }
.speakbox { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 22px; }
.mic { width: 92px; height: 92px; border-radius: 50%; border: 6px solid var(--line, var(--blue)); background: var(--panel); color: var(--line, var(--blue)); display: grid; place-items: center; } .mic .ic { width: 38px; height: 38px; } .mic.live { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse2 1.2s infinite; }
@keyframes pulse2 { 0% { box-shadow: 0 0 0 0 rgba(214, 31, 50, .5); } 100% { box-shadow: 0 0 0 22px transparent; } }
.speakout { min-height: 1.6em; text-align: center; } .selfrate { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; }
.hint { color: var(--muted); font-size: .92rem; margin: 6px 0; }
.s-foot { }
.s-foot, .s-foot * { }
.s-foot { flex: none; }
.session .s-foot { }
.s-foot { border-top: 2px solid var(--rule); }
.s-foot { background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); }
.s-foot.ok, .s-foot:has(.s-fb.ok) { background: var(--ok-bg); } .s-foot:has(.s-fb.bad) { background: var(--bad-bg); }
.s-fb { max-width: 700px; margin: 0 auto; padding: 0 16px; } .s-fb.ok, .s-fb.bad { padding-top: 14px; }
.fb-h { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; } .s-fb.ok { color: var(--ok); } .s-fb.bad { color: var(--bad); } .fb-lab { font-size: .85rem; margin-top: 6px; opacity: .9; }
.fb-x { color: var(--ink); display: flex; flex-direction: column; margin-top: 4px; max-height: 24vh; overflow: auto; } .fb-x .hz { font-size: 1.4rem; } .fb-x .zh.ruby { font-size: 1.4rem; line-height: 2; }
.s-btns { max-width: 700px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; justify-content: flex-end; }
.btn { border: 0; border-radius: 8px; padding: 14px 26px; font-weight: 900; font-size: 1.05rem; min-width: 140px; }
.btn.main { background: var(--green); color: #fff; border-bottom: 4px solid color-mix(in srgb, var(--green) 65%, #000); } .btn.main:disabled { background: var(--rule); color: var(--muted); border-bottom-color: transparent; }
.s-foot:has(.s-fb.bad) .btn.main { background: var(--bad); border-bottom-color: color-mix(in srgb, var(--bad) 65%, #000); color: #fff; }
.btn.skip { background: transparent; color: var(--muted); border: 2px solid var(--rule); font-weight: 700; }

    s: ["這位/是/王/[經理]。|zhe4 wei4 shi4 wang2 jing1 li3|This is Manager Wang.", "他/是/我們/的/[主管]。|ta1 shi4 wo3 men5 de5 zhu3 guan3|He is our supervisor.", "林/小姐/是/[業務]/助理。|lin2 xiao3 jie3 shi4 ye4 wu4 zhu4 li3|Ms. Lin is a sales assistant.", "我/是/[工程師]。|wo3 shi4 gong1 cheng2 shi1|I am an engineer.", "我們/[部門]/有/十/個/人。|wo3 men5 bu4 men2 you3 shi2 ge5 ren2|Our department has ten people.", "這位/[客戶]/從/美國/來。|zhe4 wei4 ke4 hu4 cong2 mei3 guo2 lai2|This customer comes from the US.", "[前輩]/教/我/怎麼/做。|qian2 bei4 jiao1 wo3 zen3 me5 zuo4|My senior colleague taught me how to do it.", "王/[先生]/在/等/您。|wang2 xian1 sheng5 zai4 deng3 nin2|Mr. Wang is waiting for you."],
    d: ["請問您是哪位？|qing3 wen4 nin2 shi4 na3 wei4|Who may I say is calling?>>我是廠商的業務，敝姓李。|wo3 shi4 chang3 shang1 de5 ye4 wu4 bi4 xing4 li3|I’m the vendor’s sales rep, my surname is Li.", "王經理在嗎？|wang2 jing1 li3 zai4 ma5|Is Manager Wang in?>>他在開會。|ta1 zai4 kai1 hui4|He is in a meeting.", "誰是你的主管？|shei2 shi4 ni3 de5 zhu3 guan3|Who is your supervisor?>>李經理是我的主管。|li3 jing1 li3 shi4 wo3 de5 zhu3 guan3|Manager Li is my supervisor.", "他是新人嗎？|ta1 shi4 xin1 ren2 ma5|Is he a new hire?>>對，他這個星期剛來。|dui4 ta1 zhe4 ge5 xing1 qi2 gang1 lai2|Yes, he just arrived this week."] },
  { id: "c5", part: "A", zh: "日常工作", en: "Daily work", blurb: "Clocking in, overtime, leave and business trips.",
    tip: "打卡 means clocking in or out. Time off is requested with 請假 through the company system, and 加班 (overtime) usually needs your supervisor’s approval first.",
    v: ["上班|shang4 ban1|go to work", "下班|xia4 ban1|finish work", "打卡|da3 ka3|clock in or out", "開會|kai1 hui4|have a meeting", "報告|bao4 gao4|report", "處理|chu3 li3|handle", "確認|que4 ren4|confirm", "回覆|hui2 fu4|reply", "寄|ji4|send (mail)", "傳|chuan2|send (file, message)", "列印|lie4 yin4|print", "加班|jia1 ban1|work overtime", "請假|qing3 jia4|take leave", "出差|chu1 chai1|business trip", "午休|wu3 xiu1|lunch break", "忙|mang2|busy"],
    s: ["我/每天/[上班]/都/要/打卡。|wo3 mei3 tian1 shang4 ban1 dou1 yao4 da3 ka3|I have to clock in every day.", "今天/我/要/[加班]。|jin1 tian1 wo3 yao4 jia1 ban1|I have to work overtime today.", "我/下午/要/[請假]。|wo3 xia4 wu3 yao4 qing3 jia4|I need to take leave this afternoon.", "他/下個/星期/要/去/[出差]。|ta1 xia4 ge5 xing1 qi2 yao4 qu4 chu1 chai1|He is going on a business trip next week.", "請/你/[確認]/一下。|qing3 ni3 que4 ren4 yi2 xia4|Please confirm.", "我/正在/[處理]/這個/問題。|wo3 zheng4 zai4 chu3 li3 zhe4 ge5 wen4 ti2|I’m handling this problem now.", "我/會/盡快/[回覆]/您。|wo3 hui4 jin3 kuai4 hui2 fu4 nin2|I’ll reply to you as soon as possible.", "我們/十二點/[午休]。|wo3 men5 shi2 er4 dian3 wu3 xiu1|We take our lunch break at twelve."],
    d: ["你今天會加班嗎？|ni3 jin1 tian1 hui4 jia1 ban1 ma5|Are you working overtime today?>>會，我要處理一份報告。|hui4 wo3 yao4 chu3 li3 yi2 fen4 bao4 gao4|Yes, I have a report to finish.", "明天我想請假。|ming2 tian1 wo3 xiang3 qing3 jia4|I’d like to take leave tomorrow.>>好，請先跟主管確認。|hao3 qing3 xian1 gen1 zhu3 guan3 que4 ren4|Okay, please check with your supervisor first.", "報告寄出去了嗎？|bao4 gao4 ji4 chu1 qu4 le5 ma5|Has the report been sent?>>已經寄了。|yi3 jing1 ji4 le5|Yes, it’s been sent.", "你下個星期要出差嗎？|ni3 xia4 ge5 xing1 qi2 yao4 chu1 chai1 ma5|Are you going on a business trip next week?>>對，去台中。|dui4 qu4 tai2 zhong1|Yes, to Taichung."] },
  { id: "c6", part: "A", zh: "訊息與電子郵件入門", en: "Chat and email basics", blurb: "Short replies that keep work moving on LINE and email.",
    tip: "LINE is Taiwan’s main chat app, also at work, and a quick 收到 or 了解 is expected. Multinational teams often use Teams or Slack too. In email, 副本 means CC and 附件 means attachment.",
    v: ["訊息|xun4 xi2|message", "群組|qun2 zu3|group chat", "電子郵件|dian4 zi3 you2 jian4|email", "信|xin4|letter, email", "附件|fu4 jian4|attachment", "收到|shou1 dao4|received", "了解|liao3 jie3|understood", "好的|hao3 de5|okay", "麻煩您|ma2 fan5 nin2|sorry to trouble you", "副本|fu4 ben3|CC", "主旨|zhu3 zhi3|subject line", "回信|hui2 xin4|reply (email)", "轉寄|zhuan3 ji4|forward", "開視訊|kai1 shi4 xun4|start a video call", "截圖|jie2 tu2|screenshot", "稍等|shao1 deng3|please wait a moment"],
    s: ["[收到]，/謝謝！|shou1 dao4 xie4 xie5|Received, thank you!", "請/參考/[附件]。|qing3 can1 kao3 fu4 jian4|Please refer to the attachment.", "我/已經/把/信/[寄]/給/你/了。|wo3 yi3 jing1 ba3 xin4 ji4 gei3 ni3 le5|I’ve sent you the email.", "[麻煩您]/看/一下。|ma2 fan5 nin2 kan4 yi2 xia4|Could you please take a look?", "我/[了解]/了，/謝謝。|wo3 liao3 jie3 le5 xie4 xie5|Got it, thanks.", "請/把/我/加進/[群組]。|qing3 ba3 wo3 jia1 jin4 qun2 zu3|Please add me to the group.", "郵件/的/[主旨]/要/寫/清楚。|you2 jian4 de5 zhu3 zhi3 yao4 xie3 qing1 chu3|The email subject must be written clearly.", "請/[稍等]，/我/馬上/回覆/你。|qing3 shao1 deng3 wo3 ma3 shang4 hui2 fu4 ni3|Please wait a moment, I’ll reply right away."],
    d: ["附件收到了嗎？|fu4 jian4 shou1 dao4 le5 ma5|Did you get the attachment?>>收到了，謝謝。|shou1 dao4 le5 xie4 xie5|Yes, thank you.", "可以幫我轉寄這封信嗎？|ke3 yi3 bang1 wo3 zhuan3 ji4 zhe4 feng1 xin4 ma5|Can you forward this email for me?>>沒問題。|mei2 wen4 ti2|No problem.", "我們開視訊討論吧。|wo3 men5 kai1 shi4 xun4 tao3 lun4 ba5|Let’s discuss over a video call.>>好，我五分鐘後上線。|hao3 wo3 wu3 fen1 zhong1 hou4 shang4 xian4|Okay, I’ll be online in five minutes.", "請在群組通知大家。|qing3 zai4 qun2 zu3 tong1 zhi1 da4 jia1|Please tell everyone in the group chat.>>好的，我現在發。|hao3 de5 wo3 xian4 zai4 fa1|Okay, I’ll post it now."] },
  { id: "c7", part: "B", zh: "開會", en: "Meetings", blurb: "Agree, add, object and assign action items.",
    tip: "Meetings usually end with 會議紀錄 and 待辦事項 (action items) with a 負責人 and a 期限. Disagreement is soft: 我想補充一點 or 不知道這樣可不可以… is how many people open an objection.",
    v: ["議程|yi4 cheng2|agenda", "會議紀錄|hui4 yi4 ji4 lu4|meeting minutes", "討論|tao3 lun4|discuss", "意見|yi4 jian4|opinion, feedback", "提案|ti2 an4|proposal", "同意|tong2 yi4|agree", "反對|fan3 dui4|oppose", "補充|bu3 chong1|add, supplement", "決議|jue2 yi4|resolution", "待辦事項|dai4 ban4 shi4 xiang4|action items", "負責人|fu4 ze2 ren2|person in charge", "期限|qi2 xian4|deadline", "進度|jin4 du4|progress", "延遲|yan2 chi2|delay", "風險|feng1 xian3|risk", "結論|jie2 lun4|conclusion"],
    s: ["今天/的/[議程]/有/三/項。|jin1 tian1 de5 yi4 cheng2 you3 san1 xiang4|Today’s agenda has three items.", "大家/有/什麼/[意見]/嗎？|da4 jia1 you3 shen2 me5 yi4 jian4 ma5|Does anyone have any comments?", "我/[同意]/這個/方案。|wo3 tong2 yi4 zhe4 ge5 fang1 an4|I agree with this plan.", "我/想/[補充]/一點。|wo3 xiang3 bu3 chong1 yi4 dian3|I’d like to add something.", "這項/工作/的/[負責人]/是/誰？|zhe4 xiang4 gong1 zuo4 de5 fu4 ze2 ren2 shi4 shei2|Who is in charge of this task?", "[期限]/是/下週/五。|qi2 xian4 shi4 xia4 zhou1 wu3|The deadline is next Friday.", "專案/的/[進度]/有點/落後。|zhuan1 an4 de5 jin4 du4 you3 dian3 luo4 hou4|The project is a little behind schedule.", "[會議紀錄]/我/會/寄給/大家。|hui4 yi4 ji4 lu4 wo3 hui4 ji4 gei3 da4 jia1|I’ll send the minutes to everyone."],
    d: ["大家同意這個提案嗎？|da4 jia1 tong2 yi4 zhe4 ge5 ti2 an4 ma5|Does everyone agree with this proposal?>>我同意，但有一點要補充。|wo3 tong2 yi4 dan4 you3 yi4 dian3 yao4 bu3 chong1|I agree, but I have one point to add.", "這個任務誰負責？|zhe4 ge5 ren4 wu4 shei2 fu4 ze2|Who is responsible for this task?>>我來負責。|wo3 lai2 fu4 ze2|I’ll take it.", "期限可以延遲嗎？|qi2 xian4 ke3 yi3 yan2 chi2 ma5|Can the deadline be delayed?>>可以，但請先通知客戶。|ke3 yi3 dan4 qing3 xian1 tong1 zhi1 ke4 hu4|Yes, but please notify the customer first.", "今天的結論是什麼？|jin1 tian1 de5 jie2 lun4 shi4 shen2 me5|What is today’s conclusion?>>我們下週再討論。|wo3 men5 xia4 zhou1 zai4 tao3 lun4|We’ll discuss it again next week."] },
  { id: "c8", part: "B", zh: "正式電子郵件", en: "Formal email writing", blurb: "Openings, requests and closings for business email.",
    tip: "Formal email opens with 您好 or 王經理您好 and closes with 順頌商祺 (business wishes). 煩請 and 敬請 are more formal than 請. Apologies for trouble use 造成不便，敬請見諒.",
    v: ["敬啟者|jing4 qi3 zhe3|to whom it may concern", "收件人|shou1 jian4 ren2|recipient", "敬請|jing4 qing3|respectfully request", "煩請|fan2 qing3|kindly (formal please)", "附上|fu4 shang4|attach, enclose", "來信|lai2 xin4|your email", "說明|shuo1 ming2|explanation", "詳見|xiang2 jian4|see details in", "如有任何問題|ru2 you3 ren4 he2 wen4 ti2|if you have any questions", "隨時|sui2 shi2|at any time", "聯絡|lian2 luo4|contact", "感謝|gan3 xie4|thank (formal)", "協助|xie2 zhu4|assistance", "造成不便|zao4 cheng2 bu2 bian4|cause inconvenience", "敬請見諒|jing4 qing3 jian4 liang4|please forgive us", "順頌商祺|shun4 song4 shang1 qi2|best wishes for your business"],
    s: ["[敬啟者]：|jing4 qi3 zhe3|To whom it may concern:", "感謝/您/的/[來信]。|gan3 xie4 nin2 de5 lai2 xin4|Thank you for your email.", "[附上]/報價單，/敬請/參考。|fu4 shang4 bao4 jia4 dan1 jing4 qing3 can1 kao3|Attached is the quotation, for your reference.", "如有/任何/問題，/歡迎/[隨時]/與我/聯絡。|ru2 you3 ren4 he2 wen4 ti2 huan1 ying2 sui2 shi2 yu3 wo3 lian2 luo4|If you have any questions, feel free to contact me at any time.", "[煩請]/您/協助/確認/這份/資料。|fan2 qing3 nin2 xie2 zhu4 que4 ren4 zhe4 fen4 zi1 liao4|Kindly help confirm this information.", "造成/您的/[不便]，/敬請/見諒。|zao4 cheng2 nin2 de5 bu2 bian4 jing4 qing3 jian4 liang4|We apologise for the inconvenience.", "謝謝/您的/[協助]。|xie4 xie5 nin2 de5 xie2 zhu4|Thank you for your assistance.", "[順頌]/商祺。|shun4 song4 shang1 qi2|With best wishes for your business."],
    d: ["請問何時可以收到報價？|qing3 wen4 he2 shi2 ke3 yi3 shou1 dao4 bao4 jia4|When can we receive the quotation?>>我們會在明天下午前回覆您。|wo3 men5 hui4 zai4 ming2 tian1 xia4 wu3 qian2 hui2 fu4 nin2|We’ll reply to you before tomorrow afternoon.", "附件打不開，可以再寄一次嗎？|fu4 jian4 da3 bu4 kai1 ke3 yi3 zai4 ji4 yi2 ci4 ma5|The attachment won’t open, could you send it again?>>抱歉，我現在重新寄給您。|bao4 qian4 wo3 xian4 zai4 chong2 xin1 ji4 gei3 nin2|Sorry, I’ll resend it to you now.", "感謝您的協助。|gan3 xie4 nin2 de5 xie2 zhu4 |Thank you for your assistance.>>不客氣，這是我們應該做的。|bu2 ke4 qi5 zhe4 shi4 wo3 men5 ying1 gai1 zuo4 de5|You’re welcome, it’s what we should do.", "請問這件事由誰負責？|qing3 wen4 zhe4 jian4 shi4 you2 shei2 fu4 ze2|Who is responsible for this matter?>>請聯絡李經理。|qing3 lian2 luo4 li3 jing1 li3|Please contact Manager Li."] },
  { id: "c9", part: "B", zh: "請求、追蹤與婉拒", en: "Requests, follow-ups and polite refusals", blurb: "Ask politely, remind gently and say no without saying no.",
    tip: "Taiwanese politeness is indirect. 恐怕, 可能有點困難 and 我再看看 often mean “no”. Soften requests with 麻煩 and 能不能, and follow up with 想請問一下目前的進度.",
    v: ["可以|ke3 yi3|can, may", "能不能|neng2 bu4 neng2|could you", "麻煩|ma2 fan5|to trouble", "幫忙|bang1 mang2|help", "先|xian1|first", "再|zai4|again, then", "追蹤|zhui1 zong1|follow up", "提醒|ti2 xing3|remind", "抱歉|bao4 qian4|sorry", "可惜|ke3 xi1|unfortunately", "恐怕|kong3 pa4|I’m afraid that", "目前|mu4 qian2|currently", "沒辦法|mei2 ban4 fa3|unable to", "考慮|kao3 lu4|consider", "再說|zai4 shuo1|decide later", "改天|gai3 tian1|another day"],
    s: ["[能不能]/請/你/幫/我/看/一下？|neng2 bu4 neng2 qing3 ni3 bang1 wo3 kan4 yi2 xia4|Could you take a look for me?", "我/想/[提醒]/您/一下。|wo3 xiang3 ti2 xing3 nin2 yi2 xia4|I’d like to remind you.", "請問/這件/事/[目前]/進度/如何？|qing3 wen4 zhe4 jian4 shi4 mu4 qian2 jin4 du4 ru2 he2|May I ask how this matter is progressing?", "[抱歉]，/讓/您/久等/了。|bao4 qian4 rang4 nin2 jiu3 deng3 le5|Sorry to keep you waiting.", "[恐怕]/這個/時間/不太/方便。|kong3 pa4 zhe4 ge5 shi2 jian1 bu2 tai4 fang1 bian4|I’m afraid this time isn’t very convenient.", "這個/案子/目前/[沒辦法]/處理。|zhe4 ge5 an4 zi5 mu4 qian2 mei2 ban4 fa3 chu3 li3|We can’t handle this case at the moment.", "我/會/[考慮]/看看。|wo3 hui4 kao3 lu4 kan4 kan5|I’ll think about it.", "我們/[改天]/再約，/好嗎？|wo3 men5 gai3 tian1 zai4 yue1 hao3 ma5|Let’s meet another day, okay?"],
    d: ["能不能幫我印一份？|neng2 bu4 neng2 bang1 wo3 yin4 yi2 fen4|Could you print a copy for me?>>沒問題，我馬上去。|mei2 wen4 ti2 wo3 ma3 shang4 qu4|No problem, I’ll go right now.", "這份報告什麼時候可以給我？|zhe4 fen4 bao4 gao4 shen2 me5 shi2 hou4 ke3 yi3 gei3 wo3|When can I have this report?>>不好意思，我明天一定給您。|bu4 hao3 yi4 si5 wo3 ming2 tian1 yi2 ding4 gei3 nin2|Sorry, I’ll definitely give it to you tomorrow.", "下午可以開會嗎？|xia4 wu3 ke3 yi3 kai1 hui4 ma5|Can we have the meeting this afternoon?>>恐怕不行，我下午要出差。|kong3 pa4 bu4 xing2 wo3 xia4 wu3 yao4 chu1 chai1|I’m afraid not, I’m on a business trip this afternoon.", "這個報價可以再便宜一點嗎？|zhe4 ge5 bao4 jia4 ke3 yi3 zai4 pian2 yi2 yi4 dian3 ma5|Can this quotation be a little cheaper?>>很抱歉，目前沒辦法。|hen3 bao4 qian4 mu4 qian2 mei2 ban4 fa3|I’m very sorry, we can’t at the moment."] },
  { id: "c10", part: "B", zh: "報價、訂單與付款", en: "Quotes, orders and payment", blurb: "Prices, lead times, invoices and payment terms.",
    tip: "Prices are quoted 未稅 (before the 5% business tax) or 含稅. An invoice is a 發票 and needs the buyer’s 統一編號 (8 digits). Payment terms such as 月結30天 (monthly settlement, 30 days) are standard.",
    v: ["報價|bao4 jia4|quotation", "報價單|bao4 jia4 dan1|quotation sheet", "訂單|ding4 dan1|purchase order", "單價|dan1 jia4|unit price", "數量|shu4 liang4|quantity", "含稅|han2 shui4|tax included", "未稅|wei4 shui4|before tax", "交期|jiao1 qi2|lead time", "出貨|chu1 huo4|ship out", "庫存|ku4 cun2|inventory", "發票|fa1 piao4|invoice", "統一編號|tong3 yi1 bian1 hao4|business tax ID", "請款|qing3 kuan3|request payment", "月結|yue4 jie2|monthly settlement", "付款|fu4 kuan3|pay", "折扣|zhe2 kou4|discount"],
    s: ["請/提供/[報價單]。|qing3 ti2 gong1 bao4 jia4 dan1|Please provide a quotation.", "這個/單價/是/[含稅]/的/嗎？|zhe4 ge5 dan1 jia4 shi4 han2 shui4 de5 ma5|Is this unit price tax included?", "[交期]/大概/要/多久？|jiao1 qi2 da4 gai4 yao4 duo1 jiu3|About how long is the lead time?", "我們/下週/可以/[出貨]。|wo3 men5 xia4 zhou1 ke3 yi3 chu1 huo4|We can ship next week.", "目前/[庫存]/不夠。|mu4 qian2 ku4 cun2 bu2 gou4|Stock is currently insufficient.", "請/開/[發票]/給/我。|qing3 kai1 fa1 piao4 gei3 wo3|Please issue an invoice to me.", "[統一編號]/是/多少？|tong3 yi1 bian1 hao4 shi4 duo1 shao3|What is the tax ID number?", "付款/條件/是/[月結]/三十天。|fu4 kuan3 tiao2 jian4 shi4 yue4 jie2 san1 shi2 tian1|The payment terms are monthly settlement, 30 days."],
    d: ["請問這個產品的交期是多久？|qing3 wen4 zhe4 ge5 chan3 pin3 de5 jiao1 qi2 shi4 duo1 jiu3|What is the lead time for this product?>>現貨一週，缺貨要三週。|xian4 huo4 yi4 zhou1 que1 huo4 yao4 san1 zhou1|One week if in stock, three weeks if not.", "可以給我們一點折扣嗎？|ke3 yi3 gei3 wo3 men5 yi4 dian3 zhe2 kou4 ma5|Could you give us a small discount?>>數量多的話可以。|shu4 liang4 duo1 de5 hua4 ke3 yi3|Yes, if the quantity is large.", "請問發票要開統一編號嗎？|qing3 wen4 fa1 piao4 yao4 kai1 tong3 yi1 bian1 hao4 ma5|Should the invoice carry a tax ID?>>要，麻煩您了。|yao4 ma2 fan5 nin2 le5|Yes, thank you for your trouble.", "什麼時候可以請款？|shen2 me5 shi2 hou4 ke3 yi3 qing3 kuan3|When can we request payment?>>出貨後就可以請款。|chu1 huo4 hou4 jiu4 ke3 yi3 qing3 kuan3|You can request payment after shipment."] },
  { id: "c11", part: "C", zh: "專案與簽核", en: "Projects, reports and approvals", blurb: "Schedules, budgets, sign-offs and post-mortems.",
    tip: "簽核 (sign-off) often goes through several levels, and many companies use an e-signing system. 簡報 can mean slides or a short presentation, and 檢討 means a review of what went wrong or can improve, not blame.",

    d: ["預算簽核了嗎？|yu4 suan4 qian1 he2 le5 ma5|Has the budget been signed off?>>還沒有，主管出差了。|hai2 mei2 you3 zhu3 guan3 chu1 chai1 le5|Not yet, the supervisor is away on a trip.", "專案目前進度如何？|zhuan1 an4 mu4 qian2 jin4 du4 ru2 he2|How is the project progressing?>>大約完成百分之八十。|da4 yue1 wan2 cheng2 bai3 fen1 zhi1 ba1 shi2|About 80 percent done.", "簡報什麼時候要交？|jian3 bao4 shen2 me5 shi2 hou4 yao4 jiao1|When is the presentation due?>>星期五下班前。|xing1 qi2 wu3 xia4 ban1 qian2|Before end of work on Friday.", "這次的專案為什麼延遲？|zhe4 ci4 de5 zhuan1 an4 wei4 shen2 me5 yan2 chi2|Why was this project delayed?>>因為客戶更改了規格。|yin1 wei4 ke4 hu4 geng1 gai3 le5 gui1 ge2|Because the customer changed the specification."] },
  { id: "c12", part: "C", zh: "客戶與技術溝通", en: "Customers and technical support", blurb: "Samples, validation, yield and customer complaints.",
    tip: "In tech firms an application engineer is a 應用工程師. A customer complaint is a 客訴, and in electronics the usual written reply is an 8D 報告. Datasheets are 規格書, and design-in is 導入.",
    v: ["技術支援|ji4 shu4 zhi1 yuan2|technical support", "應用工程師|ying4 yong4 gong1 cheng2 shi1|application engineer", "規格書|gui1 ge2 shu1|datasheet", "樣品|yang4 pin3|sample", "測試|ce4 shi4|test", "驗證|yan4 zheng4|validation", "導入|dao3 ru4|design-in, adopt", "量產|liang4 chan3|mass production", "良率|liang2 lv4|yield", "品質|pin3 zhi2|quality", "異常|yi4 chang2|abnormality", "客訴|ke4 su4|customer complaint", "失效分析|shi1 xiao4 fen1 xi1|failure analysis", "改善對策|gai3 shan4 dui4 ce4|corrective action", "退貨|tui4 huo4|return goods", "保固|bao3 gu4|warranty"],
    s: ["我們/可以/提供/[樣品]/給/您/測試。|wo3 men5 ke3 yi3 ti2 gong1 yang4 pin3 gei3 nin2 ce4 shi4|We can provide samples for you to test.", "這份/[規格書]/有/最新/版本。|zhe4 fen4 gui1 ge2 shu1 you3 zui4 xin1 ban3 ben3|This datasheet has the latest version.", "客戶/正在/[驗證]/這顆/晶片。|ke4 hu4 zheng4 zai4 yan4 zheng4 zhe4 ke1 jing1 pian4|The customer is validating this chip.", "預計/下個/月/開始/[量產]。|yu4 ji4 xia4 ge5 yue4 kai1 shi3 liang4 chan3|Mass production is expected to start next month.", "這批貨/的/[良率]/只有/百分之/九十。|zhe4 pi1 huo4 de5 liang2 lv4 zhi3 you3 bai3 fen1 zhi1 jiu3 shi2|The yield of this batch is only 90 percent.", "產品/出現/[異常]，/請/協助/分析。|chan3 pin3 chu1 xian4 yi4 chang2 qing3 xie2 zhu4 fen1 xi1|The product shows an anomaly, please help analyse it.", "我們/已經/收到/[客訴]。|wo3 men5 yi3 jing1 shou1 dao4 ke4 su4|We have received the customer complaint.", "產品/的/[保固]/期/是/兩年。|chan3 pin3 de5 bao3 gu4 qi2 shi4 liang3 nian2|The product warranty period is two years."],
    d: ["請問這顆晶片有最新的規格書嗎？|qing3 wen4 zhe4 ke1 jing1 pian4 you3 zui4 xin1 de5 gui1 ge2 shu1 ma5|Is there a latest datasheet for this chip?>>有，我寄給您。|you3 wo3 ji4 gei3 nin2|Yes, I’ll send it to you.", "良率為什麼下降？|liang2 lv4 wei4 shen2 me5 xia4 jiang4|Why did the yield drop?>>我們正在分析原因。|wo3 men5 zheng4 zai4 fen1 xi1 yuan2 yin1|We are analysing the cause.", "可以提供樣品讓我們測試嗎？|ke3 yi3 ti2 gong1 yang4 pin3 rang4 wo3 men5 ce4 shi4 ma5|Can you provide samples for us to test?>>可以，請填寫申請單。|ke3 yi3 qing3 tian2 xie3 shen1 qing3 dan1|Yes, please fill in the request form.", "這批貨有品質問題，要退貨。|zhe4 pi1 huo4 you3 pin3 zhi2 wen4 ti2 yao4 tui4 huo4|This batch has a quality problem, we want to return it.>>很抱歉，請告訴我們批號。|hen3 bao4 qian4 qing3 gao4 su4 wo3 men5 pi1 hao4|We’re very sorry, please tell us the batch number."] },
  { id: "c13", part: "C", zh: "公司制度與人資", en: "HR and company rules", blurb: "Leave types, overtime pay, onboarding and resigning.",

    d: ["我想請明天的假。|wo3 xiang3 qing3 ming2 tian1 de5 jia4|I’d like to take leave tomorrow.>>好，請先在系統申請。|hao3 qing3 xian1 zai4 xi4 tong3 shen1 qing3|Okay, please apply in the system first.", "你什麼時候到職？|ni3 shen2 me5 shi2 hou4 dao4 zhi2|When do you start?>>下個月一號。|xia4 ge5 yue4 yi1 hao4|The 1st of next month.", "年終獎金什麼時候發？|nian2 zhong1 jiang3 jin1 shen2 me5 shi2 hou4 fa1|When is the year-end bonus paid?>>通常在農曆年前。|tong1 chang2 zai4 nong2 li4 nian2 qian2|Usually before the Lunar New Year.", "我下個月要離職。|wo3 xia4 ge5 yue4 yao4 li2 zhi2|I’m resigning next month.>>我了解了，請先跟人資聯絡。|wo3 liao3 jie3 le5 qing3 xian1 gen1 ren2 zi1 lian2 luo4|I understand, please contact HR first."] },
  { id: "c14", part: "D", zh: "午餐與閒聊", en: "Lunch and small talk", blurb: "Invite colleagues to eat and chat about the week.",

    d: ["你吃飯了嗎？|ni3 chi1 fan4 le5 ma5|Have you eaten?>>吃了，你呢？|chi1 le5 ni3 ne5|Yes, and you?", "中午一起吃飯好嗎？|zhong1 wu3 yi4 qi3 chi1 fan4 hao3 ma5|Shall we eat together at noon?>>好啊，吃什麼？|hao3 a5 chi1 shen2 me5|Sure, what shall we eat?", "這家便當好吃嗎？|zhe4 jia1 bian4 dang1 hao3 chi1 ma5|Are this place’s boxed meals good?>>超好吃，我常來。|chao1 hao3 chi1 wo3 chang2 lai2|Super good, I come often.", "最近怎麼樣？|zui4 jin4 zen3 me5 yang4|How have you been?>>還好，就是有點忙。|hai2 hao3 jiu4 shi4 you3 dian3 mang2|Fine, just a bit busy."] },
  { id: "c15", part: "D", zh: "搭車與問路", en: "Getting around", blurb: "MRT, high-speed rail, taxis and directions.",

<script>
/* PWA Registration & Install Handler */
(function() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js')
        .then(function(reg) {
          console.log('[PWA] Service Worker registered with scope:', reg.scope);
        })
        .catch(function(err) {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
    });
  }

  var deferredPrompt = null;
  var installBtn = document.getElementById('btn-install');

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) {
      installBtn.style.display = 'inline-grid';
    }
  });

  if (installBtn) {
    installBtn.addEventListener('click', function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choice) {
          if (choice.outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        if (window.__tw && window.__tw.installModal) {
          window.__tw.installModal();
        } else {
          alert("To install this app:\n• On iPhone: Tap Share -> Add to Home Screen.\n• On Android/PC: Click Install in the browser menu or address bar.");
        }
      }
    });
  }

  window.addEventListener('appinstalled', function() {
    if (installBtn) installBtn.style.display = 'none';
    deferredPrompt = null;
    console.log('[PWA] App installed successfully');
  });
})();
</script>
